name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*'
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Check migration lock
        if: matrix.node-version == '20.x'
        run: |
          set -e
          git fetch --no-tags origin main
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-migration-lock.js --mode range --base origin/main --head HEAD
          else
            BEFORE="${{ github.event.before }}"
            if echo "$BEFORE" | grep -qE '^0+$'; then
              echo "Skipping migration lock (no previous commit)."
              exit 0
            fi
            git fetch --no-tags origin "$BEFORE"
            node scripts/check-migration-lock.js --mode range --base "$BEFORE" --head HEAD
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: |
          shopt -s globstar
          node --test --test-force-exit --import tsx src/tests/unit/**/*.test.ts src/tests/feature/**/*.test.ts src/tests/database/**/*.test.ts src/tests/integration/**/*.test.ts
        shell: bash
        env:
          CI: true

      - name: Upload build artifacts
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # NOTE: Legacy v3.x migration tests removed in v4.0.0
  # v3.x→v4 migration is handled by direct schema conversion (bootstrap migration)
  # Old tests (migration-tests, migration-safety-tests) depended on obsolete v3.x migration files
